openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: XiaDown Library API
  version: 1.0.0
  description: |
    Version 1 of the device-facing XiaDown Library API. The API is exposed only
    by a user-enabled Library transport. Pairing credentials and Bearer tokens
    are secrets; clients must not put them in URLs, analytics, logs, or crash
    reports.

    The pairing response grants `library.read` and `tasks.read` by default.
    `music.read`, `music.state`, `music.manage`, `rss.read`, `rss.state`,
    `rss.manage`, `rss.fetch`, `tasks.create`, and `tasks.control` can be granted
    later by the desktop owner. Pairing never grants either RSS management or
    public-feed fetch access by default.
    A grant is bound to one Catalog, so a valid token from another Catalog is
    rejected.

    A stable device ID and public-key hash are client assertions, not authority
    to inherit an existing grant. Pairing rejects collisions with an active
    grant. After the Desktop owner revokes a grant, a fresh short-lived pairing
    session may replace it in place: the grant identity and creation time remain
    for namespace continuity, but the token and public-key hash rotate and scopes
    reset to the default minimum. The old token remains invalid and prior managed
    scopes must be granted again by the Desktop owner.

    Canonical response property names are case-sensitive camelCase. Path and
    query parameter names are case-sensitive. Unless an input is explicitly
    marked `x-case-insensitive`, enum values and scope names are case-sensitive
    and use the lowercase spelling shown in this document.
servers:
  - url: "{transportBase}"
    description: LAN or Tailscale HTTPS base returned by the pairing link; keep any managed path prefix.
    variables:
      transportBase:
        default: https://library.local:43127
        description: HTTPS origin, optionally followed by the configured Tailscale Serve path.
tags:
  - name: System
  - name: Pairing
  - name: Sync
  - name: Library
  - name: Music
  - name: RSS
  - name: Tasks
security: []
x-xiadown-bearer-scopes:
  library.read: Read Library overview, items, assets, collections, tags, and changes.
  music.read: Read the Music Station Local catalog, playlists, artwork, lyrics, and playback resources.
  music.state: Update Music favorites, playback progress/events, and lyric selection.
  music.manage: Manage Music Station Local membership and playlists.
  rss.read: Read the RSS overview, stable snapshot, subscriptions, entry summaries/details, and synchronization changes.
  rss.state: Update the paired owner's RSS read, starred, article progress, and video progress state.
  rss.manage: Manage public RSS subscriptions and their grouping; private Desktop-managed sources remain unavailable.
  rss.fetch: Read explicitly shared public HTTPS Feed URLs, request fetch leases, and submit bounded observations.
  tasks.read: Read task lists and task details.
  tasks.create: Create a download task.
  tasks.control: Cancel or resume a task.
x-xiadown-casing:
  paths-and-query-names: case-sensitive
  request-property-names: canonical camelCase; clients must send the exact documented spelling
  response-property-names: case-sensitive canonical camelCase
  scope-names: case-sensitive lowercase dotted names
  bearer-scheme: case-insensitive per HTTP authentication rules

paths:
  /api/v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check API process health
      responses:
        "200":
          description: The versioned API router is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Read API and desktop version information
      responses:
        "200":
          description: API and application version information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/v1/pair:
    post:
      tags: [Pairing]
      operationId: pairDevice
      summary: Exchange a short-lived pairing session for a device Bearer token
      description: |
        The pairing session is consumed only after its device grant is stored
        successfully. An active device-ID collision is rejected. A revoked
        identity may be replaced in place with a rotated credential and the
        default minimum scopes; no prior managed scope is inherited.
      requestBody:
        required: true
        x-max-body-bytes: 32768
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "201":
          description: Device paired. The returned token is shown only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairResponse"
        "400":
          description: Malformed JSON, unknown fields, an oversized body, invalid request fields, or a collision with an active device grant (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: The pairing session is invalid, expired, exhausted, or already consumed (`pairing_invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The pairing exchange could not be completed (`pairing_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/device-access:
    get:
      tags: [Pairing]
      operationId: getDeviceAccess
      summary: Read the current catalog-bound device grant and effective scopes
      description: This credential-introspection endpoint requires a valid Bearer token but no business-data scope.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The identity and effective scopes bound to the presented credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The credential belongs to a different Catalog (`catalog_access_denied`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/sync/events:
    get:
      tags: [Sync]
      operationId: streamSyncEvents
      summary: Receive scope-filtered synchronization wake hints
      description: |-
        Foreground-only Server-Sent Events signal plane, advertised by the
        top-level `sync-events-v1` capability in `GET /api/v1/device-access`.
        `station-dirty` carries only a Station name, epoch, and high-water mark;
        `tasks-dirty` carries only `{ "dirty": true }`. Clients must use the
        corresponding overview/changes or task-list endpoint after every hint.
        Event loss, disconnect, suspension, replay gaps, and a missing stream do
        not affect correctness. `Last-Event-ID` only reduces duplicate wakeups
        and is never a Station cursor or acknowledgement. Desktop periodically
        revalidates the presented Bearer grant while the stream is active.
        Revocation or expiry closes the stream without an SSE error payload;
        scope changes atomically update filtering and discard any pending hint
        that is no longer authorized before it can be delivered.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LastEventID"
      responses:
        "200":
          description: |-
            An SSE stream containing `station-dirty`, `tasks-dirty`, and
            periodic comment keepalives. Events are filtered by the current
            grant's `library.read`, `music.read`, `rss.read`, and `tasks.read`
            scopes. Slow consumers receive the newest coalesced hint per
            Station rather than an unbounded queue.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stationDirty:
                  value: |-
                    id: 907
                    event: station-dirty
                    data: {"station":"music","epoch":"0123456789abcdef0123456789abcdef","highWater":1881}
        "400":
          description: Invalid numeric `Last-Event-ID` (`invalid_last_event_id`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The credential belongs to a different Catalog (`catalog_access_denied`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The HTTP transport cannot stream responses (`streaming_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/library:
    get:
      tags: [Library]
      operationId: getLibraryOverview
      summary: Read the default Catalog overview and synchronization cursor
      security:
        - bearerAuth: []
      x-xiadown-required-scope: library.read
      responses:
        "200":
          description: Current Catalog counts, health counts, and a high-water synchronization cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/library/snapshot:
    get:
      tags: [Library]
      operationId: getLibrarySnapshot
      summary: Read one stable keyset page of non-trashed Library items
      description: >-
        This route is available when `GET /api/v1/library` advertises
        `snapshot-keyset-v1`. Every cursor is bound to the requested epoch and
        high-water mark. The server checks that synchronization state before
        and after materializing the page; any concurrent Catalog mutation
        returns `reset_required` and no partial page.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: library.read
      parameters:
        - $ref: "#/components/parameters/LibrarySnapshotEpoch"
        - $ref: "#/components/parameters/LibrarySnapshotHighWater"
        - $ref: "#/components/parameters/LibrarySnapshotAfter"
        - $ref: "#/components/parameters/LibrarySnapshotLimit"
      responses:
        "200":
          description: A stable, ID-ordered page of path-free Catalog item summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarySnapshotPage"
        "400":
          description: Invalid epoch/cursor (`invalid_cursor`) or page size (`invalid_pagination`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The requested snapshot boundary is stale or changed while the page was read (`reset_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/library/items:
    get:
      tags: [Library]
      operationId: listLibraryItems
      summary: List logical Library items
      security:
        - bearerAuth: []
      x-xiadown-required-scope: library.read
      parameters:
        - $ref: "#/components/parameters/ItemCategory"
        - $ref: "#/components/parameters/ItemStatus"
        - $ref: "#/components/parameters/ExcludeTrashed"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/ItemSort"
        - $ref: "#/components/parameters/ItemLimit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A bounded item page. `total` is the count before pagination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItemList"
        "400":
          description: Invalid pagination (`invalid_pagination`) or an unsupported filter/sort/search query (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/library/items/{id}:
    get:
      tags: [Library]
      operationId: getLibraryItem
      summary: Read one logical item and its public presentation metadata
      security:
        - bearerAuth: []
      x-xiadown-required-scope: library.read
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
      responses:
        "200":
          description: Item detail. Local paths, checksums, provenance, and per-user state are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItemDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/library/assets/{id}/content:
    get:
      tags: [Library]
      operationId: getLibraryAssetContent
      summary: Stream an available asset, including byte ranges
      description: Only regular, non-symlink local files owned by a non-trashed item in the paired Catalog are served.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: library.read
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Complete asset content.
          headers:
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "206":
          description: One or more satisfiable byte ranges.
          headers:
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            Content-Range:
              $ref: "#/components/headers/ContentRange"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
          content:
            "*/*":
              schema:
                type: string
                format: binary
            multipart/byteranges:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The asset is absent, outside this Catalog, trashed, offline, missing, or otherwise unavailable (`not_found` or `asset_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "416":
          description: The requested byte range is invalid or unsatisfiable. This response is generated by the standard range server and is plain text.
          headers:
            Content-Range:
              $ref: "#/components/headers/ContentRange"
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: The concurrent asset stream limit is reached (`asset_stream_limit_reached`).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/library/collections:
    get:
      tags: [Library]
      operationId: listLibraryCollections
      summary: List sanitized Catalog collections
      security:
        - bearerAuth: []
      x-xiadown-required-scope: library.read
      parameters:
        - $ref: "#/components/parameters/CollectionLimit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A bounded array of collections. Smart query expressions are never returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryCollection"
        "400":
          $ref: "#/components/responses/InvalidPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/library/collections/{id}/items:
    get:
      tags: [Library]
      operationId: listLibraryCollectionItems
      summary: List stable item membership for one collection
      security:
        - bearerAuth: []
      x-xiadown-required-scope: library.read
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
        - $ref: "#/components/parameters/TaxonomyLimit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A bounded collection membership page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionItemsPage"
        "400":
          $ref: "#/components/responses/InvalidPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/library/tags:
    get:
      tags: [Library]
      operationId: listLibraryTags
      summary: List sanitized Catalog tags
      security:
        - bearerAuth: []
      x-xiadown-required-scope: library.read
      parameters:
        - $ref: "#/components/parameters/TaxonomyLimit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A bounded array of tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryTag"
        "400":
          $ref: "#/components/responses/InvalidPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/library/changes:
    get:
      tags: [Library]
      operationId: listLibraryChanges
      summary: Read the durable Catalog invalidation feed
      description: Fetch the overview first, then send its `sync.epoch` and last applied cursor. A reset response requires a fresh overview and full local reconciliation.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: library.read
      parameters:
        - $ref: "#/components/parameters/ChangeAfter"
        - $ref: "#/components/parameters/ChangeEpoch"
        - $ref: "#/components/parameters/ChangeLimit"
      responses:
        "200":
          description: Changes strictly after the requested cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        "400":
          description: Invalid cursor (`invalid_cursor`) or invalid page size (`invalid_pagination`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The epoch is stale/missing or the cursor is ahead of the server (`reset_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/music/overview:
    get:
      tags: [Music]
      operationId: getMusicOverview
      summary: Read the paired Music namespace and synchronization position
      description: Returns only the Desktop Music Station Local projection. It does not expose the loopback Listen API or enumerate the general Library.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: music.read
      responses:
        "200":
          description: Music namespace, current epoch/high-water/retention window, and supported read capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/music/snapshot:
    get:
      tags: [Music]
      operationId: getMusicSnapshot
      summary: Page a stable keyset snapshot of Music Tracks and Playlists
      description: Read `MusicOverview` first and keep its exact epoch/high-water pair for every page. A concurrent Desktop mutation returns `reset_required`; discard staging and negotiate a fresh snapshot.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: music.read
      parameters:
        - $ref: "#/components/parameters/MusicEpoch"
        - $ref: "#/components/parameters/MusicHighWater"
        - $ref: "#/components/parameters/MusicSnapshotCursor"
        - $ref: "#/components/parameters/MusicSyncLimit"
      responses:
        "200":
          description: A keyset page bound to the requested epoch and high-water mark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicSnapshotPage"
        "400":
          description: Invalid position/cursor (`invalid_cursor`) or page size (`invalid_pagination`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/MusicResetRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/music/changes:
    get:
      tags: [Music]
      operationId: listMusicChanges
      summary: Read canonical Music changes after a durable cursor
      description: Membership bookkeeping is not exposed. Public upserts contain the current canonical Track, Playlist, or Playlist Item projection; deletes carry no payload.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: music.read
      parameters:
        - $ref: "#/components/parameters/MusicEpoch"
        - $ref: "#/components/parameters/MusicChangeAfter"
        - $ref: "#/components/parameters/MusicSyncLimit"
      responses:
        "200":
          description: A bounded, ordered change page and the cursor durably represented by it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicChangePage"
        "400":
          description: Invalid epoch/cursor (`invalid_cursor`) or page size (`invalid_pagination`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/MusicResetRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/music/tracks/{id}:
    get:
      tags: [Music]
      operationId: getMusicTrack
      summary: Read one current Music Track projection
      description: Resource descriptors contain opaque version-bound IDs only; Desktop paths, file URLs, hosts, credentials, and provider cookies are never returned.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: music.read
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
      responses:
        "200":
          description: The current Track metadata and ordered playback/artwork resource descriptors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicTrack"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/music/tracks/{id}/compatible-representation:
    post:
      tags: [Music]
      operationId: createMusicIOSCompatibleRepresentation
      summary: Idempotently request an iOS-compatible playback Representation
      description: Uses a Desktop-managed fixed AAC/M4A baseline preset. The opaque Track ID is resolved inside Music Station; clients cannot supply a path, codec command, output location, or preset. Replaying the same request UUID returns the same durable lifecycle.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: music.manage
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
      requestBody:
        required: true
        x-max-body-bytes: 4096
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MusicCompatibleRepresentationRequest"
      responses:
        "200":
          description: A compatible resource was already ready, or this exact request UUID reached a terminal lifecycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicCompatibleRepresentationResponse"
        "202":
          description: The durable Desktop transcode is queued or running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicCompatibleRepresentationResponse"
        "400":
          description: Invalid body or request UUID (`invalid_compatible_representation_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The Track cannot be transcoded, or the request UUID was already bound to another Track.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/music/playlists:
    get:
      tags: [Music]
      operationId: listMusicPlaylists
      summary: Page current Music Playlists with stable Playlist Item identities
      security:
        - bearerAuth: []
      x-xiadown-required-scope: music.read
      parameters:
        - $ref: "#/components/parameters/MusicPlaylistLimit"
        - $ref: "#/components/parameters/MusicBrowseCursor"
      responses:
        "200":
          description: A keyset browse page. Playlist Items retain display snapshots when their Track is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicPlaylistsPage"
        "400":
          description: Invalid cursor (`invalid_cursor`) or page size (`invalid_pagination`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/MusicResetRequired"
        "500":
          $ref: "#/components/responses/InternalError"

