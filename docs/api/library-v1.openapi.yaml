          format: int64
          minimum: 0
        cumulativeListenedDurationMs:
          type: integer
          format: int64
          minimum: 0
        positionMs:
          type: integer
          format: int64
          minimum: 0
        terminal:
          type: boolean
        accepted:
          type: boolean
        replayed:
          type: boolean
        trackStateRevision:
          type: integer
          format: int64
          minimum: 0
        trackState:
