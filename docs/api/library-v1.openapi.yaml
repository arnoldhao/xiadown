  /api/v1/rss/entries/{id}/resources/{slot}:
    get:
      tags: [RSS]
      operationId: getRSSEntryResource
      summary: Fetch a persisted RSS image or direct-media slot through the restricted Desktop proxy
      description: |
        `slot` selects only a resource already present on the persisted entry:
        `thumbnail`, `image-N`, `media-N`, or `media-N-thumbnail`, where `N` is
        an integer from 0 through 63. The client
        cannot submit an arbitrary upstream URL. Each connection and redirect
        is revalidated against the public-network policy, no device/App Session
        credentials or referrer headers are forwarded, and every dial, TLS
        handshake, and response-header wait is bounded, with upstream response
        headers capped at 128 KiB. Raster images use the
        same 30-second, 12 MiB, 32,768-pixel-axis, 16-megapixel, and content
        animation limits; thumbnails and posters have a stricter 4-megapixel
        role limit and must be static.
        HLS/DASH manifests are rejected. Direct
        audio and video support one byte range per request, a 30-second upstream
        read-idle limit, and a two-hour absolute request limit; Range clients
        can continue playback with a subsequent request. Conditional request
        validators are neither accepted nor returned; responses use
        `private, no-store` because a stable slot can later resolve to a
        different upstream source. Range itself remains supported. Paired
        clients can occupy at most 12 of the 16 process-wide RSS resource
        streams, reserving four for Desktop. For a 200 media response whose
        upstream length is unknown, clean EOF is affirmed by the
        `X-XiaDown-RSS-Stream-Complete: 1` trailer. Upstream read failure,
        timeout, or size overflow resets the HTTP connection/stream instead of
        emitting a successful truncated chunked response.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: rss.read
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
        - name: slot
          in: path
          required: true
          schema:
            type: string
            pattern: "^(thumbnail|image-(?:0|[1-9]|[1-5][0-9]|6[0-3])|media-(?:0|[1-9]|[1-5][0-9]|6[0-3])(?:-thumbnail)?)$"
            maxLength: 64
        - $ref: "#/components/parameters/RSSSingleRange"
      responses:
        "200":
          description: Complete bounded raster image, audio, or video content.
          headers:
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            X-XiaDown-RSS-Stream-Complete:
              description: Emitted as a trailer with value `1` only after a clean EOF for unknown-length 200 media. A missing trailer together with a transport/body-read error indicates an aborted stream.
              schema:
                type: string
                enum: ["1"]
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "206":
          description: One audio/video byte range whose Content-Range exactly matches the requested range; chunked upstream bodies are capped to that declared length.
          headers:
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Content-Range:
              $ref: "#/components/headers/ContentRange"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The entry or selected resource slot is unavailable.
          content:
            text/plain:
              schema:
                type: string
        "416":
          description: The single byte range is malformed or the upstream representation reports it as unsatisfiable.
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: The 12-stream paired-device RSS resource limit was reached. Four of the 16 process-wide slots remain reserved for Desktop loopback reads.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            text/plain:
              schema:
                type: string
        "502":
          description: The upstream resource failed the public-network, redirect, timeout, size, decoded-dimension, animation, or MIME policy.
          content:
            text/plain:
              schema:
                type: string

  /api/v1/rss/entries/{id}/state:
    patch:
      tags: [RSS]
      operationId: updateRSSEntryState
      summary: Idempotently update one paired-owner RSS state field
      description: |
        The authenticated device identity is used for attribution; clients
        cannot submit another device or owner identifier. `expectedRevision`
        is compared with the selected field's revision. On
        `rss_state_conflict`, pull the returned current state and retry with a
        new mutation ID and that field revision. A mutation ID is bound to the
        canonical entry/field/revision/value payload; reusing it for a different
        payload returns `idempotency_conflict`.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: rss.state
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
      requestBody:
        required: true
        x-max-body-bytes: 32768
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRSSEntryStateRequest"
      responses:
        "200":
          description: The resulting complete owner state. Reusing the same mutation ID with the same canonical payload returns the original result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSSEntryState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RSSStateConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/rss/changes:
    get:
      tags: [RSS]
      operationId: listRSSChanges
      summary: Incrementally synchronize RSS subscriptions, entries, and owner read state
      description: Clients must send the persisted `epoch`. If it changes, the cursor is ahead, or the cursor is below `retainedFrom`, discard the RSS replica and fetch a new snapshot.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: rss.read
      parameters:
        - $ref: "#/components/parameters/RSSEpoch"
        - $ref: "#/components/parameters/ChangeAfter"
        - $ref: "#/components/parameters/RSSChangeLimit"
      responses:
        "200":
          description: A stable sequence page bounded by `highWater`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSSChangePage"
        "400":
          description: Invalid cursor (`invalid_cursor`) or pagination (`invalid_pagination`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/RSSResetRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List safe task projections
      security:
        - bearerAuth: []
      x-xiadown-required-scope: tasks.read
      parameters:
        - $ref: "#/components/parameters/TaskStatuses"
        - $ref: "#/components/parameters/TaskKinds"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/TaskLimit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A bounded task list. Local paths, raw URLs, logs, and process diagnostics are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          description: Invalid pagination (`invalid_pagination`) or search query (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a downloader task
      security:
        - bearerAuth: []
      x-xiadown-required-scope: tasks.create
      requestBody:
        required: true
        x-max-body-bytes: 32768
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task accepted by the Library application service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Malformed JSON, unknown fields, unsafe/private URL, unsupported mode/quality, or another invalid request (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tasks/{id}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Read one safe task projection
      security:
        - bearerAuth: []
      x-xiadown-required-scope: tasks.read
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
      responses:
        "200":
          description: Current task state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tasks/{id}/cancel:
    post:
      tags: [Tasks]
      operationId: cancelTask
      summary: Ask the Library scheduler to cancel a task
      security:
        - bearerAuth: []
      x-xiadown-required-scope: tasks.control
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
      responses:
        "200":
          description: Updated task state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TaskStateConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tasks/{id}/resume:
    post:
      tags: [Tasks]
      operationId: resumeTask
      summary: Ask the Library scheduler to resume a task
      security:
        - bearerAuth: []
      x-xiadown-required-scope: tasks.control
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
      responses:
        "200":
          description: Updated task state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TaskStateConflict"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: xd1 opaque device token
      description: "Send `Authorization: Bearer <token>`. The token is Catalog-bound and must be stored as a secret."

  headers:
    AcceptRanges:
      description: Supported range unit.
      schema:
        type: string
        const: bytes
    ContentDisposition:
      description: Safe inline filename selected by the desktop server.
      schema:
        type: string
    ContentLength:
      description: Response body length in bytes.
      schema:
        type: integer
        format: int64
        minimum: 0
    ContentRange:
      description: Byte range and complete representation length.
      schema:
        type: string
    ETag:
      description: Strong validator for the immutable version-bound resource bytes.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before opening another asset stream.
      schema:
        type: integer
        minimum: 0

  parameters:
    LastEventID:
      name: Last-Event-ID
      in: header
      description: |-
        Optional decimal SSE event ID from the last delivered hint. It is a
        best-effort replay optimization only and must not be stored or compared
        as a Library, Music, or RSS synchronization cursor.
      schema:
        type: string
        maxLength: 20
        pattern: '^[1-9][0-9]*$'
    OpaqueID:
      name: id
      in: path
      required: true
      description: Case-sensitive opaque identifier. Do not infer filesystem paths from IDs.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    SearchQuery:
      name: q
      in: query
      description: Case-insensitive substring search. After percent-decoding, the value must be valid UTF-8 and at most 512 Unicode code points. Length is evaluated before endpoint-specific whitespace handling; overlong values are rejected, never truncated.
      schema:
        type: string
        maxLength: 512
    ItemCategory:
      name: category
      in: query
      description: Canonical singular values and UI plural aliases are accepted case-insensitively.
      x-case-insensitive: true
      schema:
        $ref: "#/components/schemas/ItemCategoryFilter"
    ItemStatus:
      name: status
      in: query
      description: Item lifecycle filter, accepted case-insensitively.
      x-case-insensitive: true
      schema:
        $ref: "#/components/schemas/ItemStatusFilter"
    ExcludeTrashed:
      name: excludeTrashed
      in: query
      description: Exclude trashed logical items before sorting, counting, and pagination.
      schema:
        type: boolean
        default: false
    ItemSort:
      name: sort
      in: query
      description: Stable Catalog sort, accepted case-insensitively. Omit for `updated_desc`.
      x-case-insensitive: true
      schema:
        $ref: "#/components/schemas/ItemSort"
    ItemLimit:
      name: limit
      in: query
      description: Item page size. Omitted or zero selects the default.
      schema:
        type: integer
        minimum: 0
        maximum: 500
        default: 100
    CollectionLimit:
      name: limit
      in: query
      description: Collection page size. Omitted or zero selects the default.
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 100
    TaxonomyLimit:
      name: limit
      in: query
      description: Tag or collection-member page size. Omitted or zero selects the default.
      schema:
        type: integer
        minimum: 0
        maximum: 500
        default: 100
    TaskLimit:
      name: limit
      in: query
      description: Task page size. Omitted or zero selects the default.
      schema:
        type: integer
        minimum: 0
        maximum: 200
        default: 100
    Offset:
      name: offset
      in: query
      description: Zero-based row offset.
      schema:
        type: integer
        minimum: 0
        default: 0
    ChangeAfter:
      name: after
      in: query
      description: Last durably applied sequence. Omitted or zero begins at the start of the current epoch.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    ChangeEpoch:
      name: epoch
      in: query
      description: Epoch returned by `GET /api/v1/library`. A missing or stale value produces `reset_required`.
      schema:
        type: string
    LibrarySnapshotEpoch:
      name: epoch
      in: query
      required: true
      description: Exact lowercase epoch returned by `GET /api/v1/library`.
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    LibrarySnapshotHighWater:
      name: highWater
      in: query
      required: true
      description: Stable snapshot boundary returned as the Library overview sync cursor.
      schema:
        type: integer
        format: int64
        minimum: 0
    LibrarySnapshotAfter:
      name: after
      in: query
      description: Opaque keyset cursor returned as `next` by the preceding Library snapshot page.
      schema:
        type: string
        maxLength: 1024
        pattern: '^[A-Za-z0-9_-]*$'
    LibrarySnapshotLimit:
      name: limit
      in: query
      description: Library snapshot page size. Omitted or zero selects the default.
      schema:
        type: integer
        minimum: 0
        maximum: 500
        default: 200
    ChangeLimit:
      name: limit
      in: query
      description: Change page size. Omitted or zero selects the default.
      schema:
        type: integer
        minimum: 0
        maximum: 500
        default: 200
    MusicEpoch:
      name: epoch
      in: query
      required: true
      description: Exact lowercase epoch returned by `GET /api/v1/music/overview`.
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    MusicHighWater:
      name: highWater
      in: query
      required: true
      description: Stable snapshot boundary returned by `GET /api/v1/music/overview`.
      schema:
        type: integer
        format: int64
        minimum: 0
    MusicChangeAfter:
      name: after
      in: query
      description: Last Music change cursor atomically applied by the client.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    MusicSnapshotCursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from the previous Music snapshot page, bound to epoch and high-water.
      schema:
        type: string
        maxLength: 4096
        pattern: '^[A-Za-z0-9_-]*$'
    MusicBrowseCursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from the previous Playlist browse page, bound to the current epoch.
      schema:
        type: string
        maxLength: 4096
        pattern: '^[A-Za-z0-9_-]*$'
    MusicSyncLimit:
      name: limit
      in: query
      description: Music snapshot/change page size. Omitted or zero selects the default.
      schema:
        type: integer
        minimum: 0
        maximum: 500
        default: 200
    MusicPlaylistLimit:
      name: limit
      in: query
      description: Music Playlist browse page size. Omitted or zero selects the default.
      schema:
        type: integer
        minimum: 0
        maximum: 200
        default: 100
    MusicResourceID:
      name: resourceId
      in: path
      required: true
      description: Opaque version-bound resource identifier returned by this Track's current descriptor.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    MusicSingleRange:
      name: Range
      in: header
      required: false
      description: One HTTP byte range. Multiple ranges and non-byte range units are rejected.
      schema:
        type: string
        maxLength: 128
        pattern: "^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$"
    RSSSubscriptionID:
      name: subscriptionId
      in: query
      description: Exact case-sensitive subscription identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    RSSEntryKind:
      name: kind
      in: query
      description: Entry presentation kind, accepted case-insensitively.
      x-case-insensitive: true
      schema:
        $ref: "#/components/schemas/RSSEntryKind"
    RSSUnreadOnly:
      name: unreadOnly
      in: query
      description: Whether to return only entries that the owner has not read.
      schema:
        type: boolean
        default: false
    RSSStarredOnly:
      name: is_starred
      in: query
      description: Set to `1` to return only entries starred by the paired owner. Starred state is independent of entry kind.
      schema:
        type: integer
        enum: [1]
    RSSLimit:
      name: limit
      in: query
      description: RSS entry page size. Omitted or zero selects the default.
      schema:
        type: integer
        minimum: 0
        maximum: 500
        default: 100
    RSSEpoch:
      name: epoch
      in: query
      required: true
      description: Exact lowercase epoch returned by `GET /api/v1/rss/overview`.
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    RSSHighWater:
      name: highWater
      in: query
      required: true
      description: Snapshot high-water sequence returned by `GET /api/v1/rss/overview`.
      schema:
        type: integer
        format: int64
        minimum: 0
    RSSSnapshotCursor:
      name: cursor
      in: query
      description: Opaque server cursor from the preceding snapshot page; it is bound to `epoch` and `highWater`.
      schema:
        type: string
        maxLength: 4096
        pattern: '^[A-Za-z0-9_-]*$'
    RSSSnapshotLimit:
      name: limit
      in: query
      description: Snapshot record page size. Omitted or zero selects the default.
      schema:
        type: integer
        minimum: 0
        maximum: 500
        default: 200
    RSSChangeLimit:
      name: limit
      in: query
      description: RSS change page size. Omitted or zero selects the default.
      schema:
        type: integer
        minimum: 0
        maximum: 500
        default: 200
    TaskStatuses:
      name: status
      in: query
      description: Repeat to select multiple statuses. Matching is case-insensitive; unknown values yield no matches.
      x-case-insensitive: true
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/TaskStatus"
    TaskKinds:
      name: kind
      in: query
      description: Repeat to select multiple task kinds. Matching is case-insensitive; unknown values yield no matches.
      x-case-insensitive: true
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    Range:
      name: Range
      in: header
      required: false
      description: Standard HTTP byte range, including suffix and multiple ranges.
      schema:
        type: string
        pattern: "^bytes="
    RSSSingleRange:
      name: Range
      in: header
      required: false
      description: One HTTP byte range for an RSS direct-media slot. Multiple ranges are rejected.
      schema:
        type: string
        maxLength: 128
        pattern: "^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$"

  responses:
    BadRequest:
      description: Invalid request (`invalid_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidPagination:
      description: Invalid page size or offset (`invalid_pagination`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing, malformed, expired, revoked, or invalid Bearer token (`unauthorized`).
      headers:
        WWW-Authenticate:
          description: Bearer challenge for the XiaDown Library realm.
          schema:
            type: string
            const: 'Bearer realm="xiadown-library"'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The token belongs to another Catalog (`catalog_access_denied`) or lacks the operation scope (`insufficient_scope`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested public resource does not exist (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TaskStateConflict:
      description: The requested action is not valid in the current task state (`task_state_conflict`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RSSStateConflict:
      description: The selected field revision is stale (`rss_state_conflict`, with current state) or the mutation ID is already bound to another canonical payload (`idempotency_conflict`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/RSSStateConflictEnvelope"
              - $ref: "#/components/schemas/ErrorEnvelope"
    RSSResetRequired:
      description: The RSS epoch/cursor is no longer valid; discard the replica and bootstrap from the returned current sync position (`reset_required`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RSSResetRequiredEnvelope"
    MusicResetRequired:
      description: The Music epoch, retention cursor, or stable snapshot boundary is no longer valid; discard staging/current replica data as appropriate and bootstrap from the returned sync position (`reset_required`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MusicResetRequiredEnvelope"
    InvalidMusicMutation:
      description: The envelope, canonical request hash, mutation family/type, or strict type-selected payload is invalid (`invalid_music_mutation`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MusicEntityNotFound:
      description: The selected Music Track, Playlist, Playlist Item, membership source File, or other mutation target does not exist (`music_entity_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MusicMutationConflict:
      description: A stale revision, reused idempotency identity, unresolved dependency, or replaced Track timeline prevented the mutation.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/MusicRevisionConflictEnvelope"
              - $ref: "#/components/schemas/MusicRetryableConflictEnvelope"
              - $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Opaque server failure (`internal_error`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorCode:
      type: string
      description: Stable machine-readable API error code. Error messages and implementation details are intentionally absent.
      enum:
        - asset_stream_limit_reached
        - asset_unavailable
        - catalog_access_denied
        - insufficient_scope
        - idempotency_conflict
        - internal_error
        - invalid_cursor
        - invalid_music_mutation
        - invalid_pagination
        - invalid_request
        - music_content_changed
        - music_dependency_pending
        - music_entity_not_found
        - music_idempotency_conflict
        - music_revision_conflict
        - music_stream_limit_reached
        - not_found
        - pairing_failed
        - pairing_invalid
        - reset_required
        - rss_state_conflict
        - task_state_conflict
        - unauthorized
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorCode"

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, api]
      properties:
        status:
          type: string
          const: ok
        api:
          type: integer
          const: 1
    VersionResponse:
      type: object
      additionalProperties: false
      required: [api, version]
      properties:
        api:
          type: integer
          const: 1
        version:
          type: string

    DeviceScope:
      type: string
      enum:
        - library.read
        - music.read
        - music.state
        - music.manage
        - rss.read
        - rss.state
        - rss.manage
        - rss.fetch
        - tasks.read
        - tasks.create
        - tasks.control
    PairRequest:
      type: object
      additionalProperties: false
      required: [nonce, code, deviceID, name, publicKeyHash]
      properties:
        nonce:
          type: string
          minLength: 1
          description: Opaque nonce from the versioned pairing link.
        code:
          type: string
          pattern: "^[0-9]{6}$"
        deviceID:
          type: string
          minLength: 1
          maxLength: 255
          description: Stable, case-sensitive client installation identifier.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: User-visible device name.
        publicKeyHash:
          type: string
          pattern: "^(?:sha256:)?[0-9A-Fa-f]{64}$"
          description: SHA-256 fingerprint of the device public key, optionally prefixed by `sha256:`.
    PairResponse:
      type: object
      additionalProperties: false
      required: [grantID, token, scopes]
      properties:
        grantID:
          type: string
          minLength: 1
          maxLength: 255
        token:
          type: string
          minLength: 1
          x-sensitive: true
          description: Opaque one-time-returned Bearer credential. Store it in protected device storage.
        scopes:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DeviceScope"
    DeviceAccessResponse:
      type: object
      additionalProperties: false
      required: [grantId, catalogId, deviceId, scopes]
      properties:
        grantId:
          type: string
          minLength: 1
          maxLength: 255
        catalogId:
          type: string
          minLength: 1
          maxLength: 255
        deviceId:
          type: string
          minLength: 1
          maxLength: 255
        scopes:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DeviceScope"
        capabilities:
          type: array
          uniqueItems: true
          description: |-
            Mounted shared protocol capabilities. `sync-events-v1` gates
            `GET /api/v1/sync/events`; clients must ignore unknown values.
          items:
            type: string
            minLength: 1
        stations:
          type: object
          additionalProperties: false
          description: Mounted device-facing Station APIs and this grant's authorization for each one.
          properties:
            library:
              $ref: "#/components/schemas/StationAccessSummary"
            music:
              $ref: "#/components/schemas/StationAccessSummary"
            rss:
              $ref: "#/components/schemas/StationAccessSummary"

    StationAccessSummary:
      type: object
      additionalProperties: false
      required: [supported, authorized, capabilities]
      properties:
        supported:
          type: boolean
          const: true
        authorized:
          type: boolean
        capabilities:
          type: array
          uniqueItems: true
          description: |-
            Mounted capability identifiers. The RSS Station currently advertises
            `rss-sync-v1`, `opaque-resource-slots-v1`,
            `rss-subscription-mutations-v1`, `rss-shared-public-fetch-v1`,
            `rss-observations-v1`, and `rss-fetch-lease-v1`. Clients must still
