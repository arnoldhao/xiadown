  /api/v1/rss/subscriptions/{id}/mutations:
    post:
      tags: [RSS]
      operationId: mutateRSSSubscription
      summary: Apply one revisioned and idempotent shared-public subscription mutation
      description: |
        The path and mutation IDs are canonical client-generated UUIDs. Add and
        promote accept that path UUID as the canonical subscription identity.
        Update uses an explicit field mask; delete creates a journal tombstone.
        For update and delete, `expectedRevision` must exactly match the current
        subscription entity revision; stale and future revisions both return
        `revision_conflict`.
        Reusing a mutation ID with a different canonical request returns
        `idempotency_conflict`. Add, promote, and a publicFeedURL update also
        require the current grant to carry `rss.fetch`. A paired device cannot
        promote an existing Desktop-private source; that transition requires
        explicit Desktop UI confirmation.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: rss.manage
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
      requestBody:
        required: true
        x-max-body-bytes: 65536
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RSSSubscriptionMutationRequest"
      responses:
        "200":
          description: An update/delete receipt, or the original receipt for an identical retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSSSubscriptionMutationResult"
        "201":
          description: An add/promote receipt, or the original creation receipt for an identical retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSSSubscriptionMutationResult"
        "400":
          description: Invalid identity, operation, field mask, limits, or shared-public URL (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Revision conflict (`revision_conflict`) or mutation-ID reuse with different content (`idempotency_conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

