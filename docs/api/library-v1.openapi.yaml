      tags: [RSS]
      operationId: getRSSEntry
      summary: Read one RSS entry detail and owner state
      security:
        - bearerAuth: []
      x-xiadown-required-scope: rss.read
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
      responses:
