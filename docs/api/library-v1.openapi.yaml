          format: int64
          minimum: 1
        cumulativeListenedDurationMs:
          type: integer
          format: int64
          minimum: 0
        positionMs:
          type: integer
          format: int64
          minimum: 0
        terminal:
          type: boolean
        completed:
          type: boolean
          description: May be true only when terminal is true.
        endReason:
          type: string
          maxLength: 120
        deviceOccurredAt:
          type: string
          format: date-time

    MusicPlayEventResult:
      type: object
