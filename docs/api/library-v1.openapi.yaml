    MusicPlaylist:
      type: object
      additionalProperties: false
      required: [id, name, revision, createdAt, updatedAt, deletedAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
        revision:
          type: integer
          format: int64
          minimum: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/MusicPlaylistItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time

    MusicMutationRequest:
      type: object
      additionalProperties: false
      required: [mutationId, requestHash, type, entityId, expectedRevision, payload]
      properties:
        mutationId:
          type: string
          format: uuid
          description: A canonical lowercase UUIDv4 that is never reused for a different logical mutation.
        requestHash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: SHA-256 of UTF-8 JSON with recursively lexicographic object keys, no insignificant whitespace, and no slash/HTML escaping. The object contains family, mutationId, type, entityId, expectedRevision, optional dependency, and payload; requestHash is excluded.
        type:
          type: string
          enum:
            - setFavorite
            - setProgress
            - selectProviderLyric
            - createPlaylist
            - renamePlaylist
            - deletePlaylist
            - addPlaylistItem
            - removePlaylistItem
            - reorderPlaylist
            - setMembership
        entityId:
          type: string
          minLength: 1
          maxLength: 255
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        dependsOnMutationId:
          type: string
          format: uuid
        payload:
          description: Strict type-selected payload. The route family and `type` select one exact shape; unknown properties are rejected.
          oneOf:
            - $ref: "#/components/schemas/MusicSetFavoritePayload"
            - $ref: "#/components/schemas/MusicSetProgressPayload"
            - $ref: "#/components/schemas/MusicSelectProviderLyricPayload"
            - $ref: "#/components/schemas/MusicPlaylistNamePayload"
            - $ref: "#/components/schemas/MusicDeletePlaylistPayload"
            - $ref: "#/components/schemas/MusicAddPlaylistItemPayload"
            - $ref: "#/components/schemas/MusicRemovePlaylistItemPayload"
            - $ref: "#/components/schemas/MusicReorderPlaylistPayload"
            - $ref: "#/components/schemas/MusicSetMembershipPayload"

    MusicSetFavoritePayload:
      type: object
      additionalProperties: false
      required: [favorite]
      properties:
        favorite:
          type: boolean

    MusicSetProgressPayload:
      type: object
      additionalProperties: false
      required: [positionMs, playSessionId, contentIdentityRevision]
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
        playSessionId:
          type: string
          format: uuid
        contentIdentityRevision:
          type: integer
          format: int64
          minimum: 1

    MusicSelectProviderLyricPayload:
      type: object
      additionalProperties: false
      required:
        - clientDocumentId
        - providerId
        - providerTrackId
