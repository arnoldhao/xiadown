  /api/v1/rss/subscriptions/{id}/icon:
    get:
      tags: [RSS]
      operationId: getRSSSubscriptionIcon
      summary: Fetch one subscription icon through the restricted Desktop resource proxy
      description: |
        Resolves only the icon already attached to the persisted subscription.
        Every upstream connection and redirect is restricted to public network
        addresses; XiaDown device credentials, App Session cookies, Origin, and
        Referer are never forwarded. Dial, TLS handshake, and response-header
        waits are bounded, and upstream response headers are capped at 128 KiB;
        image fetch/read has a 30-second absolute limit.
        Returned images are sniffed, at most 12 MiB, 32,768 pixels per axis,
        and 16 megapixels; icons have a stricter 1-megapixel role limit.
        Icons must be static. Content GIF/APNG animation is capped at 256 frames
        and 64 aggregate canvas megapixels; animated WebP and AVIF fail closed because
        no reliable bounded desktop configuration decoder is enabled. The
        upstream URL never appears in this route. Conditional request validators
        are neither accepted nor returned; responses use `private, no-store`
        because a stable slot can resolve to a different upstream source later.
        Paired clients can occupy at most 12 of the 16 process-wide RSS resource
        streams, leaving four slots reserved for the tokenized Desktop loopback.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: rss.read
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
      responses:
        "200":
          description: A bounded raster icon.
          headers:
            Content-Length:
              $ref: "#/components/headers/ContentLength"
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The subscription or its icon is unavailable.
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: The 12-stream paired-device RSS resource limit was reached. Four of the 16 process-wide slots remain reserved for Desktop loopback reads.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            text/plain:
              schema:
                type: string
        "502":
          description: The upstream resource failed the public-network, redirect, timeout, size, decoded-dimension, animation, or raster MIME policy.
          content:
            text/plain:
              schema:
                type: string

  /api/v1/rss/entries:
    get:
      tags: [RSS]
      operationId: listRSSEntries
      summary: List lightweight RSS entry summaries and owner state
      security:
