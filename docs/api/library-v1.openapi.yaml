          type: array
          description: Clients that consume the availability-only RSS resource contract must require `opaque-resource-slots-v1` before applying snapshots or changes.
          items:
            type: string
          allOf:
            - contains:
                const: snapshot-keyset-v1
            - contains:
                const: opaque-resource-slots-v1

    RSSSubscription:
      type: object
      additionalProperties: false
      required: [id, workspaceId, title, iconAvailable, viewType, sortOrder, enabled, unreadCount, createdAt, updatedAt, revision, sourceAccess]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        title:
          type: string
        description:
          type: string
          maxLength: 4096
        iconAvailable:
          type: boolean
          description: True when the persisted subscription has an icon candidate addressable through the subscription icon resource route. The source URL is never serialized.
        viewType:
          $ref: "#/components/schemas/RSSViewType"
        categoryId:
          type: string
          maxLength: 255
        sortOrder:
          type: integer
        sourceAccess:
          $ref: "#/components/schemas/RSSSourceAccess"
        publicFeedURL:
          type: string
          format: uri
          maxLength: 4096
          x-sensitive: true
          description: Present only for sharedPublic and while the current grant has rss.fetch. Omission revokes any previously cached URL and fetch metadata.
        enabled:
          type: boolean
        unreadCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        revision:
          type: integer
          format: int64
          minimum: 1

    RSSSubscriptionMutationRequest:
      type: object
      additionalProperties: false
      required: [mutationId, operation]
      properties:
        mutationId:
          type: string
          format: uuid
        operation:
          $ref: "#/components/schemas/RSSSubscriptionMutationOperation"
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
          description: Required for update/delete and must exactly equal the current subscription entity revision.
        fieldMask:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum: [title, viewType, categoryId, sortOrder, enabled, publicFeedURL]
        title:
          type: string
          maxLength: 512
        viewType:
          $ref: "#/components/schemas/RSSViewType"
        categoryId:
          type: [string, "null"]
          maxLength: 255
        sortOrder:
          type: integer
          minimum: -1000000
          maximum: 1000000
        enabled:
          type: boolean
        sourceAccess:
          type: string
          const: sharedPublic
        publicFeedURL:
          type: string
          format: uri
          maxLength: 4096
          x-sensitive: true

    RSSSubscriptionMutationResult:
      type: object
      additionalProperties: false
      required: [mutationId, operation, revision, changeCursor]
      properties:
        mutationId:
          type: string
          format: uuid
        operation:
          $ref: "#/components/schemas/RSSSubscriptionMutationOperation"
        subscription:
          $ref: "#/components/schemas/RSSSubscription"
        deletedId:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
          minimum: 1
        changeCursor:
          type: integer
          format: int64
          minimum: 0

    RSSFetchLeaseRequest:
