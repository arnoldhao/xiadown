          enum: [included, excluded]
        reason:
          type: string
          enum: [user, unsupported, policy]

    MusicMutationResult:
      type: object
      additionalProperties: false
      required: [mutationId, type, entityId, revision, replayed, result]
      properties:
        mutationId:
          type: string
          format: uuid
        type:
          type: string
        entityId:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        replayed:
          type: boolean
        result:
          type: object
          description: Canonical type-selected result, including Track state, Playlist, membership, or lyric Document/Selection remapping.

    MusicPlayEventRequest:
      type: object
