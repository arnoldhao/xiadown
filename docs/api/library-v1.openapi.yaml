        - licensePolicy
        - offsetMs
      properties:
        clientDocumentId:
          type: string
          format: uuid
        providerId:
          type: string
          minLength: 1
          maxLength: 255
        providerTrackId:
          type: string
          minLength: 1
          maxLength: 1024
        timingKind:
          type: string
          enum: [plain, synced]
        language:
          type: string
          maxLength: 64
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        availability:
          type: string
          enum: [content, refetchRequired, unavailable]
        licensePolicy:
          type: string
          enum: [cacheAllowed, refetchRequired]
        offsetMs:
          type: integer
          format: int64

    MusicPlaylistNamePayload:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    MusicDeletePlaylistPayload:
      type: object
      additionalProperties: false
      maxProperties: 0

    MusicAddPlaylistItemPayload:
      type: object
