  /api/v1/rss/subscriptions/{id}/observations:
    post:
      tags: [RSS]
      operationId: submitRSSFeedObservation
      summary: Submit a bounded public-feed observation for canonical Desktop ingest
      description: |
        Desktop revalidates the versioned originKey, sanitizes every URL and
        HTML/resource descriptor, merges through the ordinary canonical RSS
        entry repository, journals accepted revisions, and returns the stable
        originKey-to-entryId mapping. The request never accepts headers, cookies,
        authorization/session state, or arbitrary temporary download paths.
        A lease is optional. Identical mutation retries return the original
        receipt; late observations cannot roll canonical content backward.
      security:
        - bearerAuth: []
      x-xiadown-required-scope: rss.fetch
      parameters:
        - $ref: "#/components/parameters/OpaqueID"
      requestBody:
        required: true
        x-max-body-bytes: 4194304
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RSSFeedObservationRequest"
      responses:
        "200":
          description: Canonical ingest counts, journal cursor, and stable identity mappings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSSFeedObservationResult"
        "400":
          description: Invalid identity, originKey, HTTPS URL, timestamp, validator, or payload limit (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
