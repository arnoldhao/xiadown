          type: string
          format: uri
          maxLength: 4096
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        title:
          type: string
          maxLength: 4096
        author:
          type: string
          maxLength: 2048
        summary:
          type: string
          maxLength: 8192
        contentHTML:
          type: string
          maxLength: 1048576
        enclosures:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/RSSObservationEnclosure"

    RSSFeedObservationRequest:
      type: object
