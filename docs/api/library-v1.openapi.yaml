        contentRevision:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    RSSEntryDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/RSSEntry"
        - type: object
          required: [contentHtml, imageSlots, mediaSlots]
          properties:
            contentHtml:
              type: string
              maxLength: 1048576
              x-max-bytes: 1048576
              description: Server-sanitized inert reading markup. Scripts, forms, frames, styles, event handlers, and every URL-bearing attribute are removed; inline images are retained in document order only as `data-xiadown-slot="image-N"` placeholders paired with `imageSlots`. Paired DTOs never embed upstream URLs.
            imageSlots:
              type: array
              maxItems: 64
              description: Positions are persisted image-N slot indices. True means the slot has a syntactically proxyable source; false preserves a non-proxyable position. No source URL is serialized.
              items:
                type: boolean
            mediaSlots:
              type: array
              maxItems: 64
              description: Positions are persisted media-N slot indices and are never compacted around unavailable resources.
              items:
                $ref: "#/components/schemas/RSSMediaSlot"

