          format: date-time
        updatedBy:
          type: string
          description: Authenticated device identifier that produced the state.
        mutationId:
          type: string

    RSSSnapshotRecord:
      type: object
      additionalProperties: false
      required: [entityType, entityId, revision, payload]
      properties:
        entityType:
          $ref: "#/components/schemas/RSSSnapshotEntityType"
        entityId:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        payload:
          oneOf:
            - $ref: "#/components/schemas/RSSSubscription"
            - $ref: "#/components/schemas/RSSEntry"

    RSSSnapshotPage:
      type: object
      additionalProperties: false
      required: [records, epoch, highWater, retainedFrom, hasMore]
      properties:
        records:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/RSSSnapshotRecord"
        epoch:
          type: string
          pattern: '^[0-9a-f]{32}$'
        highWater:
          type: integer
          format: int64
          minimum: 0
        retainedFrom:
          type: integer
          format: int64
          minimum: 0
        nextCursor:
          type: string
          maxLength: 4096
        hasMore:
          type: boolean

    RSSSyncPosition:
      type: object
      additionalProperties: false
      required: [epoch, cursor, retainedFrom]
      properties:
        epoch:
          type: string
          pattern: '^[0-9a-f]{32}$'
        cursor:
          type: integer
          format: int64
          minimum: 0
        retainedFrom:
          type: integer
          format: int64
          minimum: 0

    RSSResetRequiredEnvelope:
      type: object
      additionalProperties: false
      required: [error, sync]
      properties:
        error:
          type: string
          const: reset_required
        sync:
          $ref: "#/components/schemas/RSSSyncPosition"

    RSSStateConflictEnvelope:
      type: object
      additionalProperties: false
      required: [error, state]
      properties:
        error:
          type: string
          const: rss_state_conflict
        state:
          $ref: "#/components/schemas/RSSEntryState"

    RSSChange:
      type: object
      additionalProperties: false
      required: [sequence, entityType, entityId, operation, revision, changedAt]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        entityType:
          $ref: "#/components/schemas/RSSChangeEntityType"
        entityId:
          type: string
        operation:
          $ref: "#/components/schemas/RSSChangeOperation"
        revision:
          type: integer
          format: int64
          minimum: 1
        payload:
          type: object
          description: Lightweight entity projection for `upsert`, or only the deleted entity ID for `delete`. Subscription payloads never contain feed addresses; entry payloads never contain HTML or large media arrays.
        changedAt:
          type: string
          format: date-time

    RSSChangePage:
      type: object
      additionalProperties: false
      required: [changes, epoch, cursor, highWater, retainedFrom, hasMore]
      properties:
        changes:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/RSSChange"
        epoch:
          type: string
          pattern: '^[0-9a-f]{32}$'
        cursor:
          type: integer
          format: int64
          minimum: 0
        highWater:
          type: integer
          format: int64
          minimum: 0
        retainedFrom:
          type: integer
          format: int64
          minimum: 0
        hasMore:
          type: boolean

    TaskSpeedMetric:
      type: object
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/SpeedMetricKind"
        label:
          type: string
        bytesPerSecond:
          type: number
          minimum: 0
        framesPerSecond:
          type: number
          minimum: 0
        factor:
          type: number
          minimum: 0
    TaskProgress:
      type: object
      additionalProperties: false
      properties:
        stage:
          type: string
        percent:
          type: integer
        current:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        speed:
          type: string
        speedMetric:
          $ref: "#/components/schemas/TaskSpeedMetric"
        updatedAt:
          type: string
          format: date-time
    TaskMetrics:
      type: object
      additionalProperties: false
      required: [fileCount]
      properties:
        fileCount:
          type: integer
          minimum: 0
        totalSizeBytes:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
    Task:
      type: object
      additionalProperties: false
      required: [id, name, kind, status, metrics, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 160
          description: Sanitized display name; source URLs, paths, credentials, and token-like values are replaced by a generic name.
        kind:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        domain:
          type: string
        platform:
          type: string
        uploader:
          type: string
        publishTime:
          type: string
        progress:
          $ref: "#/components/schemas/TaskProgress"
        metrics:
          $ref: "#/components/schemas/TaskMetrics"
        errorCode:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    TaskList:
      type: object
      additionalProperties: false
      required: [tasks]
      properties:
        tasks:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Task"
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 8192
          pattern: "^https?://"
          description: Public HTTP(S) source URL. User information, local/private/special-use destinations, and NUL characters are rejected.
        title:
          type: string
          maxLength: 512
        mode:
          $ref: "#/components/schemas/TaskMode"
        quality:
          $ref: "#/components/schemas/TaskQuality"
        formatId:
          type: string
          maxLength: 256
        audioFormatId:
          type: string
          maxLength: 256
        writeThumbnail:
          type: boolean
        subtitleLangs:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 64
        subtitleAuto:
          type: boolean
        subtitleAll:
          type: boolean
        subtitleFormat:
          type: string
          maxLength: 128
        transcodePresetId:
          type: string
          maxLength: 256
        deleteSourceFileAfterTranscode:
          type: boolean
