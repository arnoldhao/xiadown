          format: uri
          maxLength: 4096
        mimeType:
          type: string
          maxLength: 256
        byteLength:
          type: integer
          format: int64
          minimum: 0
        thumbnailURL:
          type: string
          format: uri
          maxLength: 4096
        width:
          type: integer
          minimum: 0
          maximum: 32768
        height:
          type: integer
          minimum: 0
          maximum: 32768
        durationMs:
          type: integer
          format: int64
          minimum: 0

    RSSObservationEntry:
