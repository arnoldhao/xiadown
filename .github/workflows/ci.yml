name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

env:
  GO_VERSION: "1.25.12"
  BUN_VERSION: "1.3.5"
  WAILS_VERSION: "v3.0.0-alpha2.117"
  GOVULNCHECK_VERSION: "v1.6.0"

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Test release automation
        run: node --test .github/scripts/*.test.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend deps
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Generate frontend bindings
        run: wails3 task common:generate:bindings

      - name: Frontend governance audits
        run: bun run audit:all
        working-directory: frontend

      - name: Frontend dependency vulnerability audit
        run: bun audit
        working-directory: frontend

      - name: Frontend production build
        run: bun run build
        working-directory: frontend

      - name: Frontend unit tests
        run: bun run test:unit
        working-directory: frontend

      - name: Go vet & test
        run: |
          go mod verify
          go vet ./...
          go test -vet=off ./...

      - name: Race detector for network and persistence paths
        run: >-
          go test -race -vet=off
          ./internal/application/library/access
          ./internal/infrastructure/libraryserver
          ./internal/infrastructure/librarybackup
          ./internal/infrastructure/rssrepo
          ./internal/presentation/http/libraryapi
          ./internal/presentation/wails

      - name: Go production binary vulnerability audit
        shell: bash
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go build -tags production -trimpath -o "${RUNNER_TEMP}/xiadown-vulncheck" .
          govulncheck -mode=binary "${RUNNER_TEMP}/xiadown-vulncheck"

  platform-gates:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: macos
          - runner: macos-26-intel
            platform: macos
          - runner: windows-latest
            platform: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Prepare embedded frontend placeholder
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.ci-placeholder

      - name: macOS tests and production compile
        if: matrix.platform == 'macos'
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-mmacosx-version-min=14.0"
          CGO_LDFLAGS: "-mmacosx-version-min=14.0 -Wl,-no_warn_duplicate_libraries"
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          go test ./... -count=1
          go build -tags production -trimpath ./...

      - name: Windows test compile and platform-specific tests
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          # The primary CI and macOS gates run the complete functional suite.
          # Keep Windows focused on native implementations while compiling every test package.
          $windowsTests = @()
          foreach ($testFile in (git ls-files "*_windows_test.go")) {
            $windowsTests += Select-String -Path $testFile -Pattern '^func (Test[A-Za-z0-9_]+)\(' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
          }
          $windowsTests += @(
            'TestInspectCurrentChromeAtAcceptsTrustedWebSocketOnlyEndpoint'
            'TestInspectCurrentChromeAtDistinguishesStoppedAndDebuggingDisabled'
            'TestInspectCurrentChromeAtIgnoresStaleEndpointWhenChromeIsStopped'
            'TestRegisterRuntimeProcessUsesPrivatePermissions'
            'TestSnapshotCookiesRejectsStagedV20BeforeGatewayOrBrowserLaunch'
            'TestCleanupStaleSnapshotsEnforcesBoundaries'
            'TestCleanupStaleSnapshotsSkipsActiveSnapshot'
            'TestSnapshotDirectoryIsPrivateAndRootSymlinkIsRejected'
            'TestDiscoverFindsChromeReleaseChannelProfiles'
            'TestSetDependencyPathFFmpegRequiresFFprobe'
            'TestPrepareCapturedCookieJarUsesExactSecureHostAndRemovesHeader'
            'TestCertificateIsPersistedWithStableFingerprintAndPrivatePermissions'
            'TestMusicResourceCASUsesPrivateBoundedDirectory'
            'TestMusicResourceCASProtectsInstalledBlobUntilLeaderOpensIt'
            'TestLoadPlanAcceptsValidWindowsPortablePlan'
            'TestLoadPlanAcceptsValidWindowsInstallerPlan'
            'TestRestartWindowsDerivesTargetAndInstallDirectory'
            'TestNativeWindowMaterialIncludesGlassSettingsButNotUtilityWindows'
          )
          $windowsTests = $windowsTests |
            Where-Object { $_ -ne 'TestMain' } |
            Sort-Object -Unique
          if ($windowsTests.Count -eq 0) {
            throw 'No Windows-specific tests were discovered.'
          }
          $testPattern = '^(' + (($windowsTests | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')$'
          Write-Host "Compiling all packages and running $($windowsTests.Count) Windows-specific tests."
          go test ./... -run $testPattern -count=1 -timeout=10m
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Windows production compile
        if: matrix.platform == 'windows'
        env:
          CGO_ENABLED: "0"
        run: go build -tags production -trimpath ./...

  package-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(toJson(github.event.pull_request.labels), 'preview-binaries')
    needs: [ci, platform-gates]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: macos
            artifact_name: preview-macos-arm64
            artifact_suffix: macos-arm64
          - runner: macos-26-intel
            platform: macos
            artifact_name: preview-macos-x64
            artifact_suffix: macos-x64
          - runner: windows-latest
            platform: windows
            artifact_name: preview-windows-x64
            artifact_suffix: windows-x64
    runs-on: ${{ matrix.runner }}
    env:
      TELEMETRYDECK_APP_ID: ${{ secrets.TELEMETRYDECK_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate TelemetryDeck config
        shell: bash
        run: |
          test -n "${TELEMETRYDECK_APP_ID:-}" || { echo "TELEMETRYDECK_APP_ID is required"; exit 1; }

      - name: Resolve preview metadata
        shell: bash
        run: |
          head_sha="${{ github.event.pull_request.head.sha }}"
          echo "PREVIEW_ID=pr${{ github.event.pull_request.number }}-${head_sha::7}" >> "$GITHUB_ENV"
          echo "APP_VERSION=dev" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend deps
        working-directory: frontend
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun scripts/prepare-wails-deps.mjs

      - name: Install NSIS
        if: matrix.platform == 'windows'
        uses: crazy-max/ghaction-chocolatey@dfdcf5bba9c0a16358a21c13a06ec5c89024b3ac # v4.1.0
        with:
          args: install nsis

      - name: Ensure NSIS available
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS\Bin"
          if (-not (Test-Path (Join-Path $nsisPath "makensis.exe"))) {
            throw "makensis.exe not found in $nsisPath"
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build preview app (macOS)
        if: matrix.platform == 'macos'
        run: wails3 task darwin:package

      - name: Inspect preview macOS build metadata
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version --sdk macosx
          echo "Binary build metadata:"
          otool -l bin/xiadown | grep -A3 -B1 LC_BUILD_VERSION
          echo "Bundle minimum OS version:"
          plist_minimum="$(plutil -extract LSMinimumSystemVersion raw -o - bin/XiaDown.app/Contents/Info.plist)"
          test "$plist_minimum" = "14.0.0" || {
            echo "Expected bundle minimum macOS 14.0.0, got '$plist_minimum'."
            exit 1
          }
          binary_minimum="$(otool -l bin/xiadown | awk '$1 == "minos" { print $2 }' | sort -u)"
          test "$binary_minimum" = "14.0" || {
            echo "Expected Mach-O minimum macOS 14.0, got '$binary_minimum'."
            exit 1
          }
          printf 'LSMinimumSystemVersion=%s\nMach-O minos=%s\n' "$plist_minimum" "$binary_minimum"

      - name: Build preview app (Windows)
        if: matrix.platform == 'windows'
        run: wails3 task windows:package

      - name: Prepare macOS preview artifact
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            bin/XiaDown.app \
            "dist/xiadown-preview-${{ matrix.artifact_suffix }}-${PREVIEW_ID}.zip"

      - name: Prepare Windows preview artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $portableName = "xiadown-preview-${env:PREVIEW_ID}-${{ matrix.artifact_suffix }}.zip"
          Compress-Archive -Path "bin/xiadown.exe" -DestinationPath "dist/$portableName" -Force

          $installer = Get-ChildItem -Path bin -Filter "*installer.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer not found in ./bin"
          }

          $installerName = "xiadown-preview-${env:PREVIEW_ID}-${{ matrix.artifact_suffix }}-installer.exe"
          Copy-Item $installer.FullName "dist/$installerName"

      - name: Upload preview artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  weekly-regression:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend deps
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Generate frontend bindings
        run: wails3 task common:generate:bindings

      - name: Frontend governance audits
        run: bun run audit:all
        working-directory: frontend

      - name: Frontend dependency vulnerability audit
        run: bun audit
        working-directory: frontend

      - name: Frontend production build
        run: bun run build
        working-directory: frontend

      - name: Frontend unit tests
        run: bun run test:unit
        working-directory: frontend

      - name: Go vet & test
        run: |
          go mod verify
          go vet ./...
          go test -vet=off ./...

      - name: Race detector for network and persistence paths
        run: >-
          go test -race -vet=off
          ./internal/application/library/access
          ./internal/infrastructure/libraryserver
          ./internal/infrastructure/librarybackup
          ./internal/infrastructure/rssrepo
          ./internal/presentation/http/libraryapi
          ./internal/presentation/wails

      - name: Go production binary vulnerability audit
        shell: bash
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go build -tags production -trimpath -o "${RUNNER_TEMP}/xiadown-vulncheck" .
          govulncheck -mode=binary "${RUNNER_TEMP}/xiadown-vulncheck"
