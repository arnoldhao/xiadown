name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v. Leave empty to auto-increment from merged PR labels."
        required: false
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.5"
  BUN_VERSION: "1.3.5"
  WAILS_VERSION: "v3.0.0-alpha.95"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_name: ${{ steps.release.outputs.release_name }}
      base_tag: ${{ steps.release.outputs.base_tag }}
      head_sha: ${{ steps.release.outputs.head_sha }}
      release_body: ${{ steps.release.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release metadata
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node .github/scripts/prepare-release.mjs

  macos:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            artifact_suffix: arm64
          - runner: macos-26-intel
            artifact_suffix: x64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      TELEMETRYDECK_APP_ID: ${{ secrets.TELEMETRYDECK_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Validate release config
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "${TELEMETRYDECK_APP_ID:-}" || { echo "TELEMETRYDECK_APP_ID is required"; exit 1; }
          test -n "${MAC_CSC_LINK:-}" || { echo "MAC_CSC_LINK is required"; exit 1; }
          test -n "${MAC_CSC_KEY_PASSWORD:-}" || { echo "MAC_CSC_KEY_PASSWORD is required"; exit 1; }
          test -n "${APPLE_ID:-}" || { echo "APPLE_ID is required"; exit 1; }
          test -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" || { echo "APPLE_APP_SPECIFIC_PASSWORD is required"; exit 1; }
          test -n "${APPLE_TEAM_ID:-}" || { echo "APPLE_TEAM_ID is required"; exit 1; }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Sync build metadata
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          path = pathlib.Path("build/config.yml")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(r'(?m)^(\s*version:\s*")[^"]+(".*)$', rf'\g<1>{version}\g<2>', text, count=1)
          if count != 1:
              raise SystemExit("build/config.yml info.version not found")
          path.write_text(text, encoding="utf-8")
          PY
          wails3 task common:update:build-assets

      - name: Install frontend deps
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Build app
        run: wails3 task darwin:package

      - name: Inspect build metadata
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version --sdk macosx
          echo "Binary build metadata:"
          otool -l bin/xiadown | grep -A3 -B1 LC_BUILD_VERSION
          echo "Bundle minimum OS version:"
          plutil -p bin/XiaDown.app/Contents/Info.plist | grep LSMinimumSystemVersion

      - name: Import Developer ID certificate
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/xiadown-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          existing_keychains=()
          while IFS= read -r keychain; do
            keychain="${keychain//\"/}"
            existing_keychains+=("$keychain")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          security default-keychain -d user -s "$keychain_path"
          security import "$certificate_path" -P "$MAC_CSC_KEY_PASSWORD" -A -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          identity_hash="$(security find-identity -v -p codesigning "$keychain_path" | awk '/Developer ID Application/ {print $2; exit}')"
          identity_name="$(security find-identity -v -p codesigning "$keychain_path" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity_hash" || { echo "Developer ID Application identity not found"; exit 1; }
          echo "Using signing identity: $identity_name"
          echo "SIGN_IDENTITY=$identity_hash" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"

      - name: Sign and notarize app
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$APPLE_APP_SPECIFIC_PASSWORD"
          security unlock-keychain -p "$SIGN_KEYCHAIN_PASSWORD" "$SIGN_KEYCHAIN_PATH"
          codesign --force --deep --options runtime --timestamp \
            --keychain "$SIGN_KEYCHAIN_PATH" \
            --sign "$SIGN_IDENTITY" \
            --entitlements build/darwin/entitlements.plist \
            bin/XiaDown.app
          codesign --verify --deep --strict --verbose=2 bin/XiaDown.app

          notary_zip="$RUNNER_TEMP/XiaDown-notary.zip"
          ditto -c -k --keepParent bin/XiaDown.app "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple bin/XiaDown.app
          xcrun stapler validate bin/XiaDown.app

      - name: Verify notarized app
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 bin/XiaDown.app
          codesign -dv --verbose=4 bin/XiaDown.app 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q "TeamIdentifier=${APPLE_TEAM_ID}" "$RUNNER_TEMP/codesign.txt"
          spctl --assess --type execute --verbose=4 bin/XiaDown.app

      - name: Prepare artifacts
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$APPLE_APP_SPECIFIC_PASSWORD"
          security unlock-keychain -p "$SIGN_KEYCHAIN_PASSWORD" "$SIGN_KEYCHAIN_PATH"

          mkdir -p dist
          zip_artifact="xiadown-macos-${{ matrix.artifact_suffix }}-${VERSION}.zip"
          dmg_artifact="xiadown-macos-${{ matrix.artifact_suffix }}-${VERSION}.dmg"

          ditto -c -k --sequesterRsrc --keepParent bin/XiaDown.app "dist/$zip_artifact"

          unsigned_dmg="$RUNNER_TEMP/$dmg_artifact"
          rm -f "$unsigned_dmg"
          bash build/darwin/create-dmg.sh bin/XiaDown.app "$unsigned_dmg" "XiaDown"

          codesign --force --timestamp \
            --keychain "$SIGN_KEYCHAIN_PATH" \
            --sign "$SIGN_IDENTITY" \
            "$unsigned_dmg"
          xcrun notarytool submit "$unsigned_dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$unsigned_dmg"
          xcrun stapler validate "$unsigned_dmg"
          mv "$unsigned_dmg" "dist/$dmg_artifact"

          (cd dist && shasum -a 256 "$zip_artifact" > "$zip_artifact.sha256")
          (cd dist && shasum -a 256 "$dmg_artifact" > "$dmg_artifact.sha256")

      - name: List dist artifacts
        shell: bash
        run: ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts-${{ matrix.artifact_suffix }}
          path: |
            dist/xiadown-macos-${{ matrix.artifact_suffix }}-${{ needs.prepare.outputs.version }}.zip
            dist/xiadown-macos-${{ matrix.artifact_suffix }}-${{ needs.prepare.outputs.version }}.zip.sha256
            dist/xiadown-macos-${{ matrix.artifact_suffix }}-${{ needs.prepare.outputs.version }}.dmg
            dist/xiadown-macos-${{ matrix.artifact_suffix }}-${{ needs.prepare.outputs.version }}.dmg.sha256
          if-no-files-found: error

      - name: Delete signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${SIGN_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$SIGN_KEYCHAIN_PATH" || true
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      TELEMETRYDECK_APP_ID: ${{ secrets.TELEMETRYDECK_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Validate release config
        shell: bash
        run: |
          test -n "${TELEMETRYDECK_APP_ID:-}" || { echo "TELEMETRYDECK_APP_ID is required"; exit 1; }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Sync build metadata
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          path = pathlib.Path("build/config.yml")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(r'(?m)^(\s*version:\s*")[^"]+(".*)$', rf'\g<1>{version}\g<2>', text, count=1)
          if count != 1:
              raise SystemExit("build/config.yml info.version not found")
          path.write_text(text, encoding="utf-8")
          PY
          wails3 task common:update:build-assets

      - name: Install frontend deps
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Install NSIS
        uses: crazy-max/ghaction-chocolatey@v2
        with:
          args: install nsis

      - name: Ensure NSIS available
        shell: pwsh
        run: |
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS\Bin"
          if (-not (Test-Path (Join-Path $nsisPath "makensis.exe"))) {
            throw "makensis.exe not found in $nsisPath"
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build app
        run: wails3 task windows:package

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $portableName = "xiadown-windows-x64-${env:VERSION}.zip"
          Compress-Archive -Path "bin/xiadown.exe" -DestinationPath "dist/$portableName" -Force

          $installer = Get-ChildItem -Path bin -Filter "*installer.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer not found in ./bin"
          }

          $installerName = "xiadown-windows-x64-${env:VERSION}-installer.exe"
          Copy-Item $installer.FullName "dist/$installerName"

          Get-ChildItem dist | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }

      - name: List dist artifacts
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name,Length,LastWriteTime

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/xiadown-windows-x64-${{ needs.prepare.outputs.version }}.zip
            dist/xiadown-windows-x64-${{ needs.prepare.outputs.version }}.zip.sha256
            dist/xiadown-windows-x64-${{ needs.prepare.outputs.version }}-installer.exe
            dist/xiadown-windows-x64-${{ needs.prepare.outputs.version }}-installer.exe.sha256
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - macos
      - windows
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
      RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
      HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "xiadown-macos-arm64-${VERSION}.zip"
            "xiadown-macos-arm64-${VERSION}.zip.sha256"
            "xiadown-macos-arm64-${VERSION}.dmg"
            "xiadown-macos-arm64-${VERSION}.dmg.sha256"
            "xiadown-macos-x64-${VERSION}.zip"
            "xiadown-macos-x64-${VERSION}.zip.sha256"
            "xiadown-macos-x64-${VERSION}.dmg"
            "xiadown-macos-x64-${VERSION}.dmg.sha256"
            "xiadown-windows-x64-${VERSION}.zip"
            "xiadown-windows-x64-${VERSION}.zip.sha256"
            "xiadown-windows-x64-${VERSION}-installer.exe"
            "xiadown-windows-x64-${VERSION}-installer.exe.sha256"
          )
          for file in "${expected[@]}"; do
            test -f "release-assets/$file" || { echo "Missing release asset: $file"; exit 1; }
          done
          (cd release-assets && sha256sum -c "xiadown-windows-x64-${VERSION}.zip.sha256")
          (cd release-assets && sha256sum -c "xiadown-windows-x64-${VERSION}-installer.exe.sha256")
          (cd release-assets && shasum -a 256 -c "xiadown-macos-arm64-${VERSION}.zip.sha256")
          (cd release-assets && shasum -a 256 -c "xiadown-macos-arm64-${VERSION}.dmg.sha256")
          (cd release-assets && shasum -a 256 -c "xiadown-macos-x64-${VERSION}.zip.sha256")
          (cd release-assets && shasum -a 256 -c "xiadown-macos-x64-${VERSION}.dmg.sha256")

      - name: Write release notes
        shell: bash
        env:
          RELEASE_BODY: ${{ needs.prepare.outputs.release_body }}
        run: printf '%s\n' "$RELEASE_BODY" > release-notes.md

      - name: Create tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "$TAG_NAME" "$HEAD_SHA"
          git push origin "refs/tags/$TAG_NAME"
          touch "$RUNNER_TEMP/xiadown-release-tag-created"

      - name: Create draft release and upload assets
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" release-assets/* \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md \
            --target "$HEAD_SHA" \
            --draft

      - name: Publish release
        shell: bash
        run: gh release edit "$TAG_NAME" --draft=false --latest

      - name: Cleanup failed release
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/xiadown-release-tag-created" ]; then
            gh release delete "$TAG_NAME" --yes || true
            git push origin ":refs/tags/$TAG_NAME" || true
          fi
